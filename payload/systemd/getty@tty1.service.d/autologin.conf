# Builders in a Box — autologin the target user on tty1.
# Combined with /etc/profile.d/biab-firstboot.sh this drives the first-boot
# wizard automatically: the user lands in a shell, the profile script
# detects firstboot.pending and runs the wizard. After the wizard finishes
# it removes the pending marker, so subsequent boots just open a normal shell.
#
# Note: the username "paco" is hardcoded here. The autoinstall creates that
# user. If you change BIB_TARGET_USER elsewhere, update this file too.

[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \\u' --autologin paco --noclear --keep-baud %I 115200,38400,9600 $TERM
