# Builders in a Box — tmux config tuned for mobile SSH (Termius on a phone).

# Sensible defaults
set -g default-terminal "screen-256color"
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g focus-events on
set -g escape-time 0

# Status bar: minimal and readable on a small screen.
set -g status-position top
set -g status-bg colour236
set -g status-fg colour250
set -g status-left-length 30
set -g status-right-length 50
set -g status-left  '#[bold] #S #[default]'
set -g status-right '#[fg=colour245]%H:%M  %d-%b'
setw -g window-status-format         '  #I:#W  '
setw -g window-status-current-format '#[bg=colour24,fg=colour231,bold]  #I:#W  '

# Prefix: keep default C-b (Termius works fine with it).

# Quality of life
bind r source-file ~/.tmux.conf \; display-message "reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
