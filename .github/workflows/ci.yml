name: CI

on:
  push:
    branches: [main]
  pull_request:
  # FEAT-038: events made with GITHUB_TOKEN (the weekly bump bot's push) do not start
  # push/pull_request workflows, but workflow_dispatch is exempt from that rule. The
  # bot dispatches this workflow on its branch so its pull request shows real checks.
  workflow_dispatch:

# A new push to a pull request makes the run still going on its previous commit
# useless: cancel it. Only pull requests share a group; every other run (a push to
# main, a manual dispatch) gets a group of its own, so none is cancelled or queued
# out by another.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck all shell scripts
        run: |
          mapfile -t files < <(find . -name '*.sh' -not -path './.git/*' -not -path './payload/flavors/gift/maintainer/*')
          # Extensionless scripts (no .sh suffix) aren't matched by the '*.sh'
          # glob above. FEAT-017 code review: bin/biab-browse — the single
          # most security-sensitive file in the pack (re-execs itself as
          # root) — was never shellchecked because of exactly this gap.
          # Match by shebang instead of hardcoding a path list, so any future
          # extensionless script in the same shape (e.g. payload/scripts/bd)
          # is picked up automatically.
          while IFS= read -r -d '' f; do
              if head -1 "$f" 2>/dev/null | grep -qE '^#!.*\b(bash|sh)\b'; then
                  files+=("$f")
              fi
          done < <(find . -type f -perm -u+x ! -name '*.*' -not -path './.git/*' -not -path './payload/flavors/gift/maintainer/*' -print0)
          printf '%s\n' "${files[@]}"
          shellcheck -S warning "${files[@]}"

      - name: bash -n entry points
        run: |
          bash -n payload/install.sh
          bash -n payload/lib/common.sh
          bash -n payload/pack/browser/bin/biab-browse
          bash -n payload/pack/browser/install.sh
          bash -n payload/pack/browser/uninstall.sh
          bash -n payload/pack/browser/lib.sh
          bash -n payload/pack/night-shift/bin/biab-night-shift
          bash -n payload/pack/night-shift/install.sh
          bash -n payload/pack/night-shift/uninstall.sh
          bash -n payload/pack/night-shift/lib.sh
          bash -n payload/pack/night-shift/hooks/no-merge-guard.sh
          bash -n payload/pack/night-shift/tests/test-pack.sh
          [ -f installer/web/install.sh ] && bash -n installer/web/install.sh || true
          bash -n installer/cloud/render.sh
          bash -n payload/install/46-paseo.sh
          bash -n payload/paseo/bin/biab-paseo-run
          bash -n payload/paseo/bin/biab-paseo-health
          bash -n payload/paseo/bin/biab-workspace
          bash -n payload/lib/paseo.sh
          bash -n installer/cloud/bootstrap.sh
          bash -n payload/lib/pins.sh
          bash -n payload/install/40-claude-code.sh
          bash -n payload/install/42-codex-cli.sh
          bash -n payload/install/43-opencode-cli.sh
          bash -n tools/bump-pins.sh
          bash -n payload/test/pins.sh
          bash -n payload/test/bump-pins.sh
          bash -n payload/scripts/biab-project
          bash -n payload/test/starter-kit.sh
          bash -n payload/hooks/guardrail-rules.sh
          bash -n payload/lib/guard.sh
          bash -n payload/test/cli-guard.sh
          bash -n payload/hooks/biab-guardrail-codex.sh
          bash -n payload/hooks/biab-guardrail-agy.sh
          bash -n payload/hooks/opencode-guard.sh
          bash -n payload/install/47-cli-guard.sh
          bash -n payload/scripts/biab-guard

      - name: No personal references in the shippable tree
        run: bash tools/check-no-personal-refs.sh

      # FEAT-014: SSH-finalize decision logic. Includes a real `sshd -T`
      # precedence check (when sshd is present) that reproduces the HOLD-HARDENED
      # no-op bug — a later drop-in saying "no" is ignored, so the disable must
      # land in the base 00 drop-in. Skips the real-sshd asserts gracefully where
      # no sshd binary exists.
      - name: SSH finalize decision unit tests (FEAT-014)
        run: bash payload/test/ssh-finalize-decision.sh

      # FEAT-024: the install/uninstall ownership contract — "only touch what is
      # ours, and put back what we changed". Asserted nowhere until now: the
      # 2026-08-14 audit found six defects in it by reading the code while CI
      # stayed green, and the fixes then introduced three more of the same
      # class. Every case reproduces one of those. Runs as a normal user (it
      # refuses to start as root), sourcing install.sh as a library and pointing
      # the whole teardown at a mktemp -d — no VM, no network. The real `sshd -T`
      # precedence check skips cleanly where no sshd binary exists.
      - name: Install/uninstall ownership contract (FEAT-024)
        run: bash payload/test/uninstall-contract.sh

      # FEAT-027 R2: the SSH-without-tailnet install preflight. Fail-closed
      # contract — no tty and no ack must abort before touching anything.
      # Mocks `tailscale` via PATH, needs no root. Does NOT cover the live
      # VM/VPS lockout scenario — that's the manual pass in FEAT-027 R4.
      - name: SSH install preflight unit tests (FEAT-027)
        run: bash payload/test/ssh-install-preflight.sh

      # FEAT-028 R1: oauth_step's agent-friendly pause. When no console is
      # attached it must print a parseable "BIB_AGENT_PAUSE:" line and exit
      # 78 instead of racing into verify_cmd and dying with a generic error.
      # The interactive path (real console) must stay unaffected. Fakes
      # url-cmd/verify-cmd, needs no root.
      - name: OAuth agent-pause unit tests (FEAT-028)
        run: bash payload/test/oauth-agent-pause.sh

      # FEAT-029: the cloud install profile. The assertion that matters is the
      # invariant — under `cloud` nothing is written under sshd_config.d/ or
      # ssh.service.d/ and no ssh unit is toggled, which is what makes install,
      # `biab update` and uninstall safe at once. It also runs the dedicated
      # path as a control, so "cloud didn't error" can't pass against a script
      # that no-ops for everyone. No root, no network.
      - name: Cloud install profile unit tests (FEAT-029)
        run: bash payload/test/cloud-profile.sh

      # FEAT-029: the offline renderer and the first-boot bootstrap. Covers the
      # hostile-input allow-lists, a fetch that lands on the wrong commit, an
      # unreachable source, interruption and resume. git/apt/getent are mocked
      # through PATH, so nothing here reaches the network.
      - name: Cloud bootstrap unit tests (FEAT-029)
        run: bash payload/test/cloud-bootstrap.sh

      # FEAT-035: the pinned Paseo daemon. Hermetic: pin/lockfile agreement, the
      # rendered unit, the launcher against a fake tailscale and a fake CLI, and
      # the credential (created once, 0600, never in any log). No root, no
      # network, no systemd, no real Paseo.
      - name: Paseo daemon install unit tests (FEAT-035)
        run: bash payload/test/paseo.sh

      # FEAT-038: the pinned third-party tools. Hermetic (fake npm, fake systemctl, a
      # fixture server for the registry): pins and lockfiles, convergence on the
      # pin, --latest, the .pins record, OFF-PIN visibility and the opt-in timer.
      - name: Pinned tools and update tests (FEAT-038)
        run: bash payload/test/pins.sh

      # FEAT-038: the weekly bump engine, against a copy of the repo and a fixture
      # server for the npm registry and the GitHub API. No network, no real npm.
      - name: Dependency bump engine tests (FEAT-038)
        run: bash payload/test/bump-pins.sh

      # FEAT-036: the template catalogue, biab-project (scaffold without overwriting,
      # status from the disk, progress) and the static contract of the walk's skills.
      # Hermetic: no root, no network, no gh. A few seconds; `lint` is already at the
      # 300 s edge, so keep this suite short.
      - name: Starter kit tests (FEAT-036)
        run: bash payload/test/starter-kit.sh

      # FEAT-031: compact, state-derived onboarding UI. This is hermetic: it
      # renders no-color 40-column screens and both bridge routes without root,
      # network, a QR encoder or a controlling terminal.
      - name: Guided wizard UX tests (FEAT-031)
        run: BIB_NO_COLOR=1 COLUMNS=40 bash payload/test/wizard-ux.sh

      # Same gap the browser pack had (see browser-pack-tests below): this suite
      # existed but nothing ran it, so it rotted unnoticed. It had been exiting
      # 2 partway through the scaffold-seed block for some time — the harness
      # never sourced ai-cli.sh, install_hooks() took its skip path, and the
      # first assertion against the settings.json it never wrote killed the run
      # under `set -e`. Roughly 40 later assertions (quota nudge, specs hook)
      # were not running at all. Red the whole time, with nothing watching.
      # It covers the hooks contract AND the ~/.claude/settings.json merge
      # policy (we never remove a hook the user already had).
      # Formatters are optional: missing black/ruff/shfmt turn into SKIPs.
      - name: Hooks + scaffold-seed test suite
        run: bash payload/hooks/tests/run-tests.sh

      # FEAT-042: the shell-command guard every CLI shares (golden corpus, one decision
      # function), the capability tokens, the `biab status` safety-net block and the
      # safe hooks merge (no invalid JSON overwritten, no symlink followed, atomic
      # write). Hermetic and about 6 s: `lint` is at the 300 s edge, keep it short.
      - name: Shell guard + safe hooks merge tests (FEAT-042)
        run: bash payload/test/cli-guard.sh

      # FEAT-025: the night-shift pack. Sections A and B need no root, no
      # network and no systemd — they cover the opt-in invariants, the
      # fail-closed mode matrix, the PreToolUse guard (including the two cases
      # that exist because a guard reading an env var instead of stdin JSON
      # would pass every test while checking nothing), and real passes against
      # mktemp fixtures with a CLI mock that records its own invocation.
      # Section C (real install, root) skips cleanly here and is exercised in
      # the manual hardware pass.
      #
      # The mutation battery (tests/mutations.sh) is deliberately NOT run
      # here: it rewrites files in the working tree and restores them, which
      # has no business sharing a job with the normal suite.
      - name: Night-shift pack test suite (FEAT-025)
        run: bash payload/pack/night-shift/tests/test-pack.sh

      - name: git archive cleanliness
        run: |
          # The shippable tarball must not contain maintainer-only paths.
          if git archive HEAD | tar -t | grep -E '(^|/)(specs/|payload/flavors/gift/maintainer/)'; then
            echo "ERROR: maintainer-only paths leaked into git archive" >&2
            exit 1
          fi
          echo "git archive is clean"

  # FEAT-020: the CLIs below come from the adapter registry
  # (BIB_SUPPORTED_AI_CLIS in payload/lib/ai-cli.sh), so registering a new CLI
  # automatically adds its wiring smoke — no workflow edit needed.
  #
  # Per-CLI wiring canary (FEAT-013). Exercises the claude, antigravity, codex and
  # opencode dispatch surfaces so a change that breaks one of them turns red instead of
  # shipping silently.
  #
  # One job that loops, not a job per CLI: each smoke takes about six seconds and
  # GitHub bills every job a whole minute, so a matrix of three plus a job to list
  # them cost four minutes for half a minute of work. A failing CLI does not stop
  # the others: all of them run and the failures are named at the end.
  #
  # NOTE: this is the hermetic wiring smoke, NOT the full VM dry-run. A GitHub
  # runner has no `ubuntu` user, no systemd/Tailscale, and no way to install
  # the real stack or reach Google's release/OAuth endpoints, so the full
  # `payload/test/dryrun.sh` (and, above all, agy token persistence across a
  # reboot — risk R1) is validated only by the manual multipass E2E pass in the
  # FEAT-013 QA plan (CP-02). This job asserts the wiring, not persistence.
  wiring-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: wiring smoke, once per CLI in the registry
        env:
          BIB_OAUTH_MOCK: "1"
          BIB_PASEO_RUN_CMD: "true"
          BIB_PASEO_TEST: "1"
        run: |
          mapfile -t clis < <(bash -c 'source payload/lib/ai-cli.sh; for c in "${BIB_SUPPORTED_AI_CLIS[@]}"; do printf "%s\n" "$c"; done')
          # An empty list would pass the loop below without testing anything.
          if [[ "${#clis[@]}" -eq 0 ]]; then
              echo "::error::the adapter registry listed no CLI" >&2
              exit 1
          fi
          echo "registry CLIs: ${clis[*]}"
          failed=()
          for cli in "${clis[@]}"; do
              echo "::group::wiring smoke ($cli)"
              if BIB_AI_CLI="$cli" bash payload/test/wiring-smoke.sh; then
                  echo "wiring smoke ($cli): ok"
              else
                  failed+=("$cli")
              fi
              echo "::endgroup::"
          done
          if [[ "${#failed[@]}" -gt 0 ]]; then
              echo "::error::wiring smoke failed for: ${failed[*]}" >&2
              exit 1
          fi

      # FEAT-040: the OpenCode adapter. It sits in this job and not in `lint` (already at
      # the 300 s edge) so it costs no extra job minute: about 4 s with no opencode on the
      # runner (the section that drives the real binary then says SKIP). Hermetic: the pinned
      # installer against fixture tarballs through its sandbox seams, the permission seed and
      # the gate that feeds paseo_supports_cli, and the login step against stubs.
      - name: OpenCode adapter tests (FEAT-040)
        run: bash payload/test/opencode.sh

  # FEAT-017 code review gap: the browser pack's own test harness (Section A
  # static regression checks — opt-in invariants, the --no-sandbox static
  # grep, the screenshot-destination validation added by this same review)
  # was never invoked in CI. Section C (real install, root-only) is still
  # exercised only by the manual multipass VM E2E pass, not here — this
  # runner has no throwaway box to install the real system user/sudoers rule
  # on. Section B (local-fixture CLI contract, needs Node + a real Chromium)
  # is attempted for real below; if the driver/Chromium install step fails
  # (e.g. a flaky network pull), it's logged clearly and test-pack.sh's own
  # SKIP path takes over — not silently green either way.
  browser-pack-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install browser pack driver dependencies (Section B, best-effort real install)
        working-directory: payload/pack/browser/driver
        run: |
          set -x
          if npm install --no-audit --no-fund && npx playwright install --with-deps chromium; then
            echo "browser-pack-tests: driver deps + Chromium installed — Section B will run for real"
          else
            echo "::warning::browser-pack-tests: driver dependency install failed — test-pack.sh's Section B will SKIP cleanly instead of running for real (see its own SKIP lines below)"
          fi

      - name: Run browser pack test suite (FEAT-017)
        run: bash payload/pack/browser/tests/test-pack.sh

  # FEAT-038: the hermetic suite cannot tell whether a pinned version still INSTALLS
  # or still has the flags BIAB calls (Paseo renamed --background to --no-wait between
  # patch releases). This job installs each pin for real, exactly as the installers
  # do, and asserts the reported version equals the pin. It runs on workflow_dispatch
  # (the bump bot dispatches it) and, otherwise, only when a pin file changed, so
  # ordinary pull requests pay nothing: the legs then finish at the first step.
  pins-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [claude-code, codex, paseo, agy]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Did a pin change?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          run=false
          pins='^(payload/pins/|payload/paseo/package(-lock)?\.json$|payload/lib/pins\.sh$|payload/lib/paseo\.sh$|payload/install/41-antigravity-cli\.sh$|payload/wizard/50-paseo\.sh$)'
          # changed <range>: capture the diff FIRST. A failed git diff must mean "run", never a
          # silent skip (a pipeline `git diff | grep -q` would read a failure as "no pin changed").
          changed() {
            local d
            d="$(git diff --name-only "$1")" || return 0
            grep -Eq "$pins" <<<"$d"
          }
          case "$EVENT" in
            workflow_dispatch) run=true ;;
            pull_request)
              if changed "origin/${BASE_REF}...HEAD"; then run=true; fi ;;
            *)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
                 || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
                 || changed "${BEFORE}...HEAD"; then run=true; fi ;;
          esac
          echo "event=$EVENT run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "20"

      - name: Install the pin and check its version (${{ matrix.tool }})
        if: steps.gate.outputs.run == 'true'
        env:
          TOOL: ${{ matrix.tool }}
        run: |
          set -euo pipefail
          # shellcheck source=payload/lib/pins.sh
          source payload/lib/pins.sh
          d="$(mktemp -d)"
          # Every binary downloaded here runs under `env -i` (pin_run_isolated): nothing of the CI
          # environment (GITHUB_ENV, tokens) is visible to it.
          probe() { pin_run_isolated "$1" --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true; }
          npm_pin() { # <dir> <pkg> <bin-function> : npm ci as the installers do, then --version
            local dir="$1" pkg="$2" fn="$3" want got
            want="$(pin_npm_pkg_version "$dir" "$pkg")"
            cp "$dir/package.json" "$dir/package-lock.json" "$d/"
            (cd "$d" && npm ci --omit=dev --no-audit --no-fund --ignore-scripts)
            got="$(probe "$("$fn" "$d")")"
            echo "$pkg: pin $want, installed reports ${got:-nothing}"
            [ "$got" = "$want" ] || { echo "::error::$pkg pinned to $want but the installed tree reports '${got}'"; exit 1; }
          }
          case "$TOOL" in
            claude-code) npm_pin payload/pins/claude-code "@anthropic-ai/claude-code" pin_bin_claude ;;
            codex)       npm_pin payload/pins/codex "@openai/codex" pin_bin_codex ;;
            paseo)
              npm_pin payload/paseo "@getpaseo/cli" pin_bin_paseo
              # The flags the wizard passes to `paseo run`, read from the caller itself.
              flags="$(sed -n '/"\${runner\[@\]}"/,/PASEO_AGENT_TITLE/p' payload/wizard/50-paseo.sh | grep -oE -- '--[a-z][a-z-]*' | sort -u)"
              flags="$flags
          $(sed -n 's/^PASEO_RUN_BACKGROUND_FLAG="\(.*\)"/\1/p' payload/lib/paseo.sh)"
              [ -n "$flags" ] || { echo "::error::could not derive the paseo run flags from the callers"; exit 1; }
              help="$(pin_run_isolated "$d/node_modules/.bin/paseo" run --help)"
              for f in $flags; do
                grep -Eq "^ +(-[a-z], )?${f}( |$)" <<<"$help" || { echo "::error::'paseo run --help' no longer lists ${f}, which BIAB passes"; exit 1; }
              done
              echo "paseo run lists every flag BIAB passes: $(echo $flags)"
              ;;
            agy)
              want="$(sed -n 's/^AGY_VERSION="\([0-9.]*\)".*/\1/p' payload/install/41-antigravity-cli.sh)"
              sha="$(sed -n 's/^AGY_SHA256_LINUX_X64="\([0-9a-f]*\)".*/\1/p' payload/install/41-antigravity-cli.sh)"
              asset=agy_cli_linux_x64.tar.gz
              curl -fsSL "https://github.com/google-antigravity/antigravity-cli/releases/download/${want}/${asset}" -o "$d/$asset"
              printf '%s  %s\n' "$sha" "$d/$asset" | sha256sum -c - || { echo "::error::agy ${want}: sha256 of ${asset} differs from AGY_SHA256_LINUX_X64"; exit 1; }
              tar -xzf "$d/$asset" -C "$d" antigravity
              got="$(probe "$d/antigravity")"
              echo "agy: pin $want, installed reports ${got:-nothing}"
              [ "$got" = "$want" ] || { echo "::error::agy pinned to $want but the binary reports '${got}'"; exit 1; }
              # Paseo's provider needs `agy acp`; 46-paseo.sh runs this same preflight.
              pin_run_isolated "$d/antigravity" acp --help >/dev/null || { echo "::error::agy ${want} has no 'acp' subcommand"; exit 1; }
              ;;
          esac
